[tool.poetry]
name = "GeoIP"
version = "0.1.0"
description = "FastAPI service that renders an IP address location on a map."
authors = ["August Meyers"]
readme = "README.md"
packages = [{ include = "geoip", from = "src" }]

[tool.poetry.dependencies]
python = ">=3.11,<4.0"
fastapi = "^0.140.7"
granian = { extras = ["reload"], version = ">=2.0,<3.0" }
httpx = "^0.28.1"
geoip2 = "^5.2.0"
pydantic-settings = "^2.7.1"
pillow = "^12.3.0"
pyshp = "^3.1.6"
loguru = "^0.7.3"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.4"

[tool.poetry.scripts]
GeoIP = "geoip.main:main"
geoip-test = "geoip.testing:main"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
